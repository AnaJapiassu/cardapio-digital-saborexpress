<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaborExpress - Cardápio Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <!-- Cabeçalho Fixo -->
  <header class="bg-orange-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-xl md:text-2xl font-bold tracking-tight">🍔 SaborExpress</h1>
        <p class="text-xs text-orange-100">Aberto agora • Entrega rápida</p>
      </div>
      
      <div class="flex items-center gap-3">
        <button id="btn-toggle-admin" class="text-xs bg-orange-700 hover:bg-orange-800 px-3 py-2 rounded-lg font-medium transition">
          Painel Admin
        </button>
        <button id="btn-abrir-carrinho" class="relative bg-white text-orange-600 hover:bg-orange-50 px-4 py-2 rounded-lg font-bold shadow flex items-center gap-2 transition">
          <span>🛒 Carrinho</span>
          <span id="contador-carrinho" class="bg-orange-600 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo Principal: Visão do Cliente -->
  <main id="visao-cliente" class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full">
    
    <!-- Barra de Busca e Filtros -->
    <section class="mb-6 space-y-4">
      <input 
        type="text" 
        id="campo-busca" 
        placeholder="Buscar lanche, bebida ou sobremesa..." 
        class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-orange-500 bg-white shadow-sm"
      >

      <div id="filtros-categoria" class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        <button data-categoria="Todos" class="btn-categoria bg-orange-600 text-white px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap">Todos</button>
        <button data-categoria="Lanches" class="btn-categoria bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap hover:bg-gray-100">Lanches</button>
        <button data-categoria="Bebidas" class="btn-categoria bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap hover:bg-gray-100">Bebidas</button>
        <button data-categoria="Sobremesas" class="btn-categoria bg-white text-gray-700 border border-gray-300 px-4 py-2 rounded-full text-sm font-semibold whitespace-nowrap hover:bg-gray-100">Sobremesas</button>
      </div>
    </section>

    <!-- Grade Responsiva de Produtos -->
    <section id="lista-produtos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Os cards dos produtos serão inseridos aqui via JavaScript -->
    </section>
  </main>

  <!-- Visão do Administrador (Oculta inicialmente) -->
  <section id="visao-admin" class="hidden max-w-4xl mx-auto px-4 py-6 flex-grow w-full">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">Gerenciar Cardápio</h2>
      <button id="btn-voltar-cardapio" class="text-sm text-orange-600 font-semibold hover:underline">← Voltar ao Cardápio</button>
    </div>

    <!-- Formulário de Novo Produto -->
    <form id="form-novo-produto" class="bg-white p-5 rounded-xl shadow-sm border border-gray-200 mb-8 space-y-4">
      <h3 class="font-bold text-lg text-gray-700">Cadastrar Novo Item</h3>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <input type="text" id="admin-nome" placeholder="Nome do produto" required class="px-3 py-2 border rounded-lg">
        <input type="number" id="admin-preco" step="0.01" placeholder="Preço (ex: 25.90)" required class="px-3 py-2 border rounded-lg">
        <select id="admin-categoria" class="px-3 py-2 border rounded-lg bg-white">
          <option value="Lanches">Lanches</option>
          <option value="Bebidas">Bebidas</option>
          <option value="Sobremesas">Sobremesas</option>
        </select>
        <input type="url" id="admin-imagem" placeholder="URL da imagem (opcional)" class="px-3 py-2 border rounded-lg">
      </div>
      <textarea id="admin-descricao" rows="2" placeholder="Descrição dos ingredientes" required class="w-full px-3 py-2 border rounded-lg"></textarea>
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold px-5 py-2 rounded-lg transition">
        + Salvar Produto
      </button>
    </form>

    <!-- Lista de Gerenciamento -->
    <div id="admin-lista-produtos" class="space-y-3">
      <!-- Itens para ativar/esgotar inseridos via JS -->
    </div>
  </section>

  <!-- Modal / Drawer Lateral do Carrinho -->
  <div id="modal-carrinho" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40 flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between p-6 overflow-y-auto shadow-2xl">
      <div>
        <div class="flex justify-between items-center border-b pb-4 mb-4">
          <h2 class="text-xl font-bold">Seu Pedido</h2>
          <button id="btn-fechar-carrinho" class="text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
        </div>

        <!-- Itens no Carrinho -->
        <div id="itens-carrinho" class="space-y-4 mb-6">
          <p class="text-gray-500 text-center py-6">Seu carrinho está vazio.</p>
        </div>

        <!-- Formulário de Checkout -->
        <form id="form-checkout" class="space-y-3 border-t pt-4">
          <h3 class="font-bold text-gray-700">Dados para Finalização</h3>
          <input type="text" id="cliente-nome" placeholder="Seu nome completo *" required class="w-full px-3 py-2 border rounded-lg">
          
          <select id="cliente-entrega" class="w-full px-3 py-2 border rounded-lg bg-white">
            <option value="Entrega">Entrega (Delivery)</option>
            <option value="Retirada">Retirada no Balcão</option>
          </select>

          <input type="text" id="cliente-endereco" placeholder="Endereço completo (Rua, Nº, Bairro) *" class="w-full px-3 py-2 border rounded-lg">

          <select id="cliente-pagamento" class="w-full px-3 py-2 border rounded-lg bg-white">
            <option value="Pix">Pix</option>
            <option value="Cartão de Crédito/Débito">Cartão (Maquininha)</option>
            <option value="Dinheiro">Dinheiro</option>
          </select>
        </form>
      </div>

      <!-- Rodapé do Carrinho -->
      <div class="border-t pt-4 mt-6">
        <div class="flex justify-between text-lg font-bold mb-4">
          <span>Total:</span>
          <span id="valor-total" class="text-orange-600">R$ 0,00</span>
        </div>
        <button id="btn-finalizar-pedido" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl shadow transition">
          Finalizar Pedido (WhatsApp)
        </button>
      </div>
    </div>
  </div>

  <!-- Rodapé -->
  <footer class="bg-gray-800 text-gray-400 text-center py-4 text-xs mt-10">
    <p>SaborExpress © 2026 - Projeto Acadêmico de ADS</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
